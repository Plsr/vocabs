# Local development database. Production uses the Postgres container on Coolify.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vocabs
      POSTGRES_PASSWORD: vocabs
      POSTGRES_DB: vocabs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabs -d vocabs"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
