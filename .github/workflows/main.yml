name: main
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  publish-release:
    runs-on: ubuntu-latest
    needs: [lint, test, ci]
    concurrency:
      group: deploy-production
    environment:
      name: production
    steps:
      - name: release
        run: |
          curl --fail --request GET '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
